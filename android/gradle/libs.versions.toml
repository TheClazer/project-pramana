#
# Pramāṇa — Gradle version catalog
#
# Pinned to a known-stable set for the v1.1 bible scaffold (2024-06).
# If Android Studio prompts to upgrade on sync, accept; just keep AGP and
# Kotlin in lockstep with the Compose Compiler version.
#

[versions]
# Build tooling
agp                       = "8.5.2"
kotlin                    = "1.9.24"
ksp                       = "1.9.24-1.0.20"

# AndroidX core
core-ktx                  = "1.13.1"
lifecycle                 = "2.8.2"
activity-compose          = "1.9.0"

# Compose
compose-bom               = "2024.06.00"
compose-compiler          = "1.5.14"   # MUST match Kotlin 1.9.24

# CameraX (bible: YUV_420_888 + ImageAnalysis + ImageCapture)
camerax                   = "1.3.4"

# Imaging / EXIF
exifinterface             = "1.3.7"

# Coroutines
coroutines                = "1.8.1"

# JSON + JCS
kotlinx-serialization     = "1.6.3"
# RFC 8785 JSON Canonicalization Scheme — Erik Rissanen's reference impl.
# https://github.com/erdtman/java-json-canonicalization
jcs                       = "1.1"

# ML runtimes
tflite                    = "2.14.0"
tflite-gpu                = "2.14.0"
tflite-gpu-delegate-plugin = "0.4.4"
tflite-support            = "0.4.4"
# QNN TFLite Delegate ships as an AAR from Qualcomm Developer Network, dropped
# into app/libs/ — NOT on Maven. See setup-checklist.md item 13.

# MediaPipe Tasks (Face Mesh for rPPG ROIs)
mediapipe-tasks           = "0.10.14"

# Signal processing
jtransforms               = "3.1"

# Testing
junit                     = "4.13.2"
androidx-test-junit       = "1.2.1"
androidx-test-espresso    = "3.6.1"
truth                     = "1.4.4"

[libraries]
# Core
androidx-core-ktx              = { group = "androidx.core",          name = "core-ktx",                version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",   version.ref = "lifecycle" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose      = { group = "androidx.activity",      name = "activity-compose",        version.ref = "activity-compose" }

# Compose (versions come from the BOM)
androidx-compose-bom           = { group = "androidx.compose",       name = "compose-bom",             version.ref = "compose-bom" }
androidx-compose-ui            = { group = "androidx.compose.ui",    name = "ui" }
androidx-compose-ui-graphics   = { group = "androidx.compose.ui",    name = "ui-graphics" }
androidx-compose-ui-tooling    = { group = "androidx.compose.ui",    name = "ui-tooling" }
androidx-compose-ui-tooling-pv = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
androidx-compose-material3     = { group = "androidx.compose.material3", name = "material3" }

# CameraX
androidx-camera-core           = { group = "androidx.camera",        name = "camera-core",             version.ref = "camerax" }
androidx-camera-camera2        = { group = "androidx.camera",        name = "camera-camera2",          version.ref = "camerax" }
androidx-camera-lifecycle      = { group = "androidx.camera",        name = "camera-lifecycle",        version.ref = "camerax" }
androidx-camera-view           = { group = "androidx.camera",        name = "camera-view",             version.ref = "camerax" }
androidx-camera-video          = { group = "androidx.camera",        name = "camera-video",            version.ref = "camerax" }

# Imaging
androidx-exifinterface         = { group = "androidx.exifinterface", name = "exifinterface",           version.ref = "exifinterface" }

# Coroutines
kotlinx-coroutines-core        = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Serialization + JCS
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
jcs                            = { group = "io.github.erdtman",      name = "java-json-canonicalization", version.ref = "jcs" }

# TFLite + delegates
tflite                         = { group = "org.tensorflow",         name = "tensorflow-lite",            version.ref = "tflite" }
tflite-gpu                     = { group = "org.tensorflow",         name = "tensorflow-lite-gpu",        version.ref = "tflite-gpu" }
tflite-gpu-delegate-plugin     = { group = "org.tensorflow",         name = "tensorflow-lite-gpu-delegate-plugin", version.ref = "tflite-gpu-delegate-plugin" }
tflite-support                 = { group = "org.tensorflow",         name = "tensorflow-lite-support",    version.ref = "tflite-support" }

# MediaPipe
mediapipe-tasks-vision         = { group = "com.google.mediapipe",   name = "tasks-vision",            version.ref = "mediapipe-tasks" }

# FFT
jtransforms                    = { group = "com.github.wendykierp",  name = "JTransforms",             version.ref = "jtransforms" }

# Tests
junit                          = { group = "junit",                  name = "junit",                   version.ref = "junit" }
androidx-test-ext-junit        = { group = "androidx.test.ext",      name = "junit",                   version.ref = "androidx-test-junit" }
androidx-test-espresso-core    = { group = "androidx.test.espresso", name = "espresso-core",           version.ref = "androidx-test-espresso" }
truth                          = { group = "com.google.truth",       name = "truth",                   version.ref = "truth" }

[plugins]
android-application            = { id = "com.android.application",   version.ref = "agp" }
kotlin-android                 = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization           = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                            = { id = "com.google.devtools.ksp",   version.ref = "ksp" }
